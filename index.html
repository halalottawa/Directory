    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.customElements && window.customElements.define) {
            var origDefine = window.customElements.define;
            window.customElements.define = function(name, constructor, options) {
              if (!window.customElements.get(name)) {
                origDefine.call(this, name, constructor, options);
              }
            };
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var cookies = document.cookie || "";
          var isHttps = location.protocol === 'https:';
          var maxAge = '; max-age=2592000'; // 30 days
          if (!cookies.includes('__session=')) {
            if (isHttps) {
              document.cookie = '__session=true; path=/; SameSite=None; Secure; Partitioned' + maxAge;
              document.cookie = '__session=true; path=/; SameSite=None; Secure' + maxAge;
            } else {
              document.cookie = '__session=true; path=/; SameSite=Lax' + maxAge;
            }
          }
          if (!cookies.includes('cookie_check=')) {
            if (isHttps) {
              document.cookie = 'cookie_check=passed; path=/; SameSite=None; Secure; Partitioned' + maxAge;
              document.cookie = 'cookie_check=passed; path=/; SameSite=None; Secure' + maxAge;
            } else {
              document.cookie = 'cookie_check=passed; path=/; SameSite=Lax' + maxAge;
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Defer Analytics & Third-Party Publisher Scripts until after window load / idle to eliminate TBT -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-226RR0C4XS');

      function initThirdPartyScripts() {
        if (window.__thirdPartyLoaded) return;
        window.__thirdPartyLoaded = true;

        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-226RR0C4XS';
        document.head.appendChild(ga);

        var swg = document.createElement('script');
        swg.async = true;
        swg.src = 'https://news.google.com/swg/js/v1/publisher.js';
        document.head.appendChild(swg);
      }

      if (document.readyState === 'complete') {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(initThirdPartyScripts, { timeout: 3000 });
        } else {
          setTimeout(initThirdPartyScripts, 2000);
        }
      } else {
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(initThirdPartyScripts, { timeout: 3000 });
          } else {
            setTimeout(initThirdPartyScripts, 2000);
          }
        });
      }
    </script>
